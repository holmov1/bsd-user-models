[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "user-distillation"
version = "0.1.0"
description = "Belief-subspace distillation for user models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/user_distillation"]

[tool.ruff]
line-length = 100
